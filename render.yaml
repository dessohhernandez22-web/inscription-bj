services:
  - type: web
    name: einscription-api
    runtime: node
    plan: free
    buildCommand: npm install && cd server && npm install && cd .. && npm run build
    startCommand: node server/index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    autoDeploy: true
